<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Meu Dot · prévia da interface</title>
<style>
:root{color-scheme:light;--paper:#f4efe9;--ink:#1a1512;--muted:#6e655c;--rule:#ddd3c9;--amber:#f99d22;--amber-deep:#c9700c;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink)}.wrap{width:min(1184px,calc(100% - 80px));margin:auto}header{height:77px;border-bottom:1px solid var(--rule);display:flex;align-items:center;justify-content:space-between}.wordmark{font-size:18px;font-weight:680;letter-spacing:-.06em;display:flex;align-items:center;gap:10px}.symbol{position:relative;display:inline-block;width:30px;height:15px}.symbol:before,.symbol:after{content:"";position:absolute;width:11px;height:11px;border:2px solid var(--ink);border-radius:100%;top:1px}.symbol:before{left:0}.symbol:after{right:0}.symbol{background:linear-gradient(var(--ink),var(--ink)) center/7px 2px no-repeat}.mono{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;text-transform:uppercase;letter-spacing:.13em;font-size:11px;line-height:1.4}.meta{color:var(--muted)}main{display:grid;grid-template-columns:.84fr 1.16fr;align-items:center;min-height:calc(100svh - 153px);gap:clamp(15px,3vw,48px);padding:38px 0}.intro{max-width:390px}.kicker{display:flex;align-items:center;gap:9px}.kicker i{background:var(--amber);width:19px;height:2px}.intro h1{margin:17px 0 16px;font-size:clamp(57px,6.6vw,95px);font-weight:520;letter-spacing:-.052em;word-spacing:.05em;line-height:.96}.intro h1 em{font-style:normal;color:var(--amber-deep)}.lead{font-size:16px;line-height:1.5;max-width:330px;color:#4a423b;margin:0 0 30px}.label{margin:0 0 10px;font-weight:550;color:var(--muted)}.controls{display:flex;gap:6px;flex-wrap:wrap;max-width:374px}.controls button{border:1px solid #d9cec3;background:transparent;padding:9px 13px;border-radius:18px;font-size:13px;color:var(--ink);cursor:pointer;transition:background .15s}.controls button:hover{background:#ebe2d8}.controls button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}.panel-status{border-top:1px solid var(--rule);padding-top:17px;margin-top:24px;min-height:58px;font-size:13px;line-height:1.5;color:var(--muted)}.instrument{display:grid;justify-items:center;align-content:center;isolation:isolate;position:relative;width:100%;padding:14px 0 12px}.bezel{width:min(100%,clamp(330px,35.5vw,495px));position:relative;aspect-ratio:1;border-radius:50%;background:linear-gradient(130deg,#29242b 0%,#c5bfc0 12%,#676267 21%,#302c31 47%,#b9afb2 68%,#524c53 87%,#2c272e 100%);padding:7px;box-shadow:0 20px 33px -20px #2d192d85, inset 1px 1px 2px #fff9,inset -1px -2px 2px #271e28}.bezel:before{content:"";position:absolute;z-index:-1;height:10%;width:4.6%;background:linear-gradient(90deg,#716a71,#383237 50%,#554c54);right:.4%;top:24%;transform:rotate(-24deg);border-radius:4px}.glass{border-radius:50%;padding:8px;background:#09090b;box-shadow:inset 0 0 0 1px #817680;overflow:hidden;width:100%;height:100%}canvas{display:block;width:100%;height:100%;border-radius:50%;touch-action:none;user-select:none;-webkit-user-select:none;background:#000;cursor:pointer}button:focus-visible,canvas:focus-visible{outline:3px solid var(--amber);outline-offset:4px}.engraving{display:flex;align-items:center;gap:10px;color:#71636d;text-align:center;margin-top:25px}.engraving:before,.engraving:after{content:"";height:1px;width:22px;background:#cbbfc4}footer{border-top:1px solid var(--rule);min-height:58px;display:flex;justify-content:space-between;align-items:center;color:var(--muted);gap:16px}.footnote{font-size:12px}.live{display:inline-flex;align-items:center;gap:6px}.live i{width:7px;height:7px;border:1.5px solid var(--amber-deep);border-radius:50%}@media(max-width:720px){.wrap{width:calc(100% - 36px)}header{height:52px}.meta{font-size:9px}main{display:flex;flex-direction:column;gap:0;padding:18px 0 22px;min-height:0}.intro{display:contents}.kicker,.intro h1,.lead{align-self:flex-start}.kicker{font-size:9px}.intro h1{font-size:49px;margin:7px 0 9px}.lead{font-size:14px;max-width:100%;margin:0}.instrument{order:1;padding:15px 0}.bezel{width:min(83vw,365px)}.engraving{margin-top:12px;font-size:9px}.scenarios{order:2;align-self:stretch}.label{font-size:10px}.controls{max-width:none}.panel-status{margin-top:12px;min-height:0;padding-top:10px}.footnote{font-size:10px}footer{min-height:46px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<body><div class="wrap"><header><span class="wordmark"><i class="symbol" aria-hidden="true"></i>meu dot</span><span class="meta mono">Waveshare · 1.75C</span></header>
<main><div class="intro"><div class="kicker mono"><i></i>Interface do dispositivo</div><h1>Meu <em>Dot.</em></h1><p class="lead">Segure o personagem para falar. Solte para enviar. Deslize do topo para abrir os ajustes.</p>
<section class="scenarios"><p class="label mono">Experimentar na prévia</p><div class="controls" aria-label="Cenários">
<button data-sc="voz" aria-pressed="true">Conversa</button><button data-sc="ajustes">Ajustes</button><button data-sc="resposta">Resposta longa</button><button data-sc="decisao">Decisão</button><button data-sc="parear">Pareamento</button><button data-sc="offline">Sem internet</button><button data-sc="erro">Falha</button><button data-sc="repouso">Repouso</button>
</div><p class="label mono" style="margin-top:18px">Bateria simulada</p><select id="battery" aria-label="Bateria simulada"><option value="3,78">78% · usando bateria</option><option value="15,100">100% · carregando</option><option value="3,0">0% · bateria baixa</option><option value="9,255">USB · sem bateria</option><option value="0,255">Leitura indisponível</option></select><div class="panel-status" role="status" aria-live="polite" id="caption">Iniciando a interface…</div></section></div>
<div class="instrument"><div class="bezel"><div class="glass"><canvas id="screen" width="466" height="466" tabindex="0" aria-label="Tela da Waveshare. Use espaço para falar, Enter para avançar e as setas para ler ou escolher."></canvas></div></div><div class="engraving mono">AMOLED &nbsp;·&nbsp; 466 × 466</div></div></main>
<footer><span class="footnote live"><i></i>Simulação local · microfone desligado</span><span class="footnote">Bluetooth LE &nbsp;/&nbsp; Android</span></footer></div>
<script>
const W='__WASM64__';
(async()=>{
const {instance}=await WebAssembly.instantiate(Uint8Array.from(atob(W),c=>c.charCodeAt(0)));const u=instance.exports,p=u.preview_init(),cv=document.querySelector('canvas'),ctx=cv.getContext('2d',{alpha:false}),img=ctx.createImageData(466,466),out=new Uint32Array(img.data.buffer),pix=new Uint16Array(u.memory.buffer,p,466*466),pal=new Uint32Array(65536);
for(let i=0;i<65536;i++){const r=i>>11,g=i>>5&63,b=i&31;pal[i]=0xff000000|((b<<3|b>>2)<<16)|((g<<2|g>>4)<<8)|(r<<3|r>>2);}
const captions=['Pareamento. No Android, abra o cliente e selecione Dot de bolso.','Pronto. Mantenha pressionado por um segundo ou mais.','Gravando no simulador. Arraste para cima para cancelar.','Pedido a caminho. A resposta nesta prévia é um exemplo.','Resposta disponível. Toque para ler.','Toque em Avançar ou deslize para a esquerda.','Leia o pedido antes de tocar em Recusar ou Confirmar.','A placa está pareada. A ponte para o Dot está indisponível.','A entrega não foi confirmada. Toque em Voltar.','Os dois indicadores separam o Bluetooth do acesso ao Dot.','O personagem descansou. Um toque o acorda.','Enviando. A placa transfere o áudio para o Android.','Ajuste volume e brilho. Toque no Bluetooth para ligar ou desligar.','Escolha qual botão deseja configurar.','Toque no atalho que o botão deve executar.','Bluetooth desligado. O menu continua disponível pelo toque.'];
const now=()=>Math.floor(performance.now())>>>0;
const longText='A revisão do relatório ficou pronta. Falta sua decisão sobre a versão que vai para a equipe. Você pediu que eu preserve as fontes e destaque os pontos ainda em aberto. Posso mostrar os dois trechos que precisam de revisão no nosso chat.';
const input=s=>{const bytes=new TextEncoder().encode(s);const m=new Uint8Array(u.memory.buffer,u.preview_input(),1100);m.fill(0);m.set(bytes.subarray(0,1099));};
let delayed=0,mode='voz',prev=-1,last=0,held=false,confirmation='';
function sample(s){clearTimeout(delayed);held=false;confirmation='';mode=s;u.dot_link(1,1,now());u.preview_idle(now());u.dot_passkey(-1);
 if(s==='ajustes')u.dot_open_settings(now());
 if(s==='resposta'){input(longText);u.preview_reply(0,now());}
 if(s==='decisao'){input('Posso preparar a versão final?');u.preview_reply(1,now());}
 if(s==='parear'){u.dot_link(0,0,now());u.dot_passkey(284619);}
 if(s==='offline')u.dot_link(1,0,now()); if(s==='erro'){input('Não recebi o áudio completo.');u.preview_error(now());} if(s==='repouso')u.preview_rest(now());
 for(const b of document.querySelectorAll('[data-sc]'))b.setAttribute('aria-pressed',String(b.dataset.sc===s));prev=-1;frame(now(),true);}
function advance(){let a;while((a=u.dot_next_action())){
 if(a===2){delayed=setTimeout(()=>{u.dot_delivered(now());delayed=setTimeout(()=>{if(u.dot_screen_id()===3){input('O relatório está pronto. Há uma decisão sua pendente sobre a versão final.');u.preview_reply(0,now());}},800);},300);}
 if(a===5||a===6)confirmation=a===5?'Escolha de exemplo registrada: confirmar.':'Escolha de exemplo registrada: recusar.';
}}
function frame(t,force=false){if(!force&&t-last<48)return;last=t;u.dot_tick(t);
 if(u.dot_screen_id()===2)u.dot_sound_level(35+Math.round(35*Math.abs(Math.sin(t/185))));
 u.dot_playback_level(u.dot_screen_id()===4 ? Math.round(84*Math.abs(Math.sin(t/165))) : 0);
 advance();u.dot_paint(t);for(let i=0;i<out.length;i++)out[i]=pal[pix[i]];ctx.putImageData(img,0,0);
 const s=u.dot_screen_id();if(s!==prev){document.querySelector('#caption').textContent=confirmation||captions[s];prev=s;}}
function loop(t){frame(t|0);requestAnimationFrame(loop);}
function pos(e){const r=cv.getBoundingClientRect();return [Math.round((e.clientX-r.left)*466/r.width),Math.round((e.clientY-r.top)*466/r.height)];}
cv.onpointerdown=e=>{if(held||e.button!==0)return;cv.setPointerCapture(e.pointerId);held=true;confirmation='';u.dot_down(...pos(e),now());};
cv.onpointermove=e=>{if(held)u.dot_move(...pos(e),now());};
cv.onpointerup=e=>{if(held){held=false;u.dot_up(...pos(e),now());frame(now(),true);}};
function cancelHold(){if(!held)return;held=false;u.dot_move(-400,-400,now());u.dot_up(-400,-400,now());frame(now(),true);}
cv.onpointercancel=cancelHold;window.addEventListener('blur',cancelHold);
cv.onkeydown=e=>{if(![' ','Enter','ArrowLeft','ArrowRight','Escape'].includes(e.key))return;e.preventDefault();if(e.repeat)return;
 if(e.key==='Escape'){cancelHold();return;}if(e.key===' '&&u.dot_screen_id()===1){held=true;u.dot_down(233,380,now());return;}
 const x=e.key==='ArrowLeft'?150:300;u.dot_down(x,380,now());u.dot_up(x,380,now());frame(now(),true);};
cv.onkeyup=e=>{if(e.key===' '&&held){held=false;u.dot_up(233,380,now());frame(now(),true);}};
const mq=matchMedia('(prefers-reduced-motion: reduce)');u.dot_reduce_motion(+mq.matches);mq.addEventListener?.('change',()=>u.dot_reduce_motion(+mq.matches));
for(const b of document.querySelectorAll('[data-sc]'))b.onclick=()=>sample(b.dataset.sc);
const battery=document.querySelector('#battery');
function batteryState(){const [flags,percent]=battery.value.split(',').map(Number);u.dot_battery(flags,percent);frame(now(),true);}
battery.onchange=batteryState;batteryState();
sample('voz');requestAnimationFrame(loop);
})().catch(e=>{document.querySelector('#caption').textContent='O navegador não conseguiu abrir a simulação WebAssembly.';console.error(e);});
</script></body></html>
